[package]
name = "we-all-eat-program"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Permissionless reserve/supply priced Token-2022 wrapper"

[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
svm-tests = []

[dependencies]
we-all-eat-math = { path = "../../crates/we-all-eat-math" }
pinocchio = { version = "=0.11.2", features = ["cpi"] }
pinocchio-system = "=0.6.1"
pinocchio-token = "=0.7.0"
solana-address = { version = "=2.6.1", features = ["decode", "curve25519"] }
solana-instruction = "3"
borsh = { version = "1.6", default-features = false, features = ["derive"] }
spl-token-2022-interface = "=3.1.1"
spl-associated-token-account-interface = "=2.0.0"

[dev-dependencies]
mollusk-svm = "=0.15.1"
mollusk-svm-programs-token = "=0.15.1"
solana-account = "4"
solana-pubkey = "4"
solana-sdk-ids = "3"
solana-program-error = "3"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
