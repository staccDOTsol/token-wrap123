[package]
name = "spl-lp-wrap"
version = "0.1.0"
description = "Unified AMM LP token wrapper - wraps Raydium / PumpSwap LP tokens of a mint pair into a single share token"
authors = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[features]
no-entrypoint = []
# Selects each AMM's devnet program ids (Raydium differs on devnet). Never
# enable for mainnet builds.
devnet = []

[dependencies]
bytemuck = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
solana-account-info = { workspace = true }
solana-cpi = { workspace = true }
solana-instruction = { workspace = true }
solana-msg = { workspace = true }
solana-program-entrypoint = { workspace = true }
solana-program-error = { workspace = true }
solana-program-pack = { workspace = true }
solana-pubkey = { workspace = true }
solana-rent = { workspace = true }
solana-system-interface = { workspace = true }
solana-sysvar = { workspace = true }
spl-associated-token-account-interface = { workspace = true }
spl-pod = { workspace = true }
spl-token = { workspace = true }
spl-token-2022 = { workspace = true }
spl-token-metadata-interface = { workspace = true }
thiserror = { workspace = true }

[lib]
crate-type = ["cdylib", "lib"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
