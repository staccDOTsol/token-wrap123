# Fly.io config for the LP Wrap NAV engine (crank + degen UI).
# RPC_URL (with the Helius key) is set as a Fly secret, not committed here.
app = "lp-wrap-nav-engine"
primary_region = "iad"

[build]

[env]
  CLUSTER = "mainnet"
  POLL_MS = "20000"
  PROGRAM_ID = "EbmEELwtg3iqHdtNCKcRwZCKmWzGpF11ZTvc9sPxBQJB"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
